name: Socialcam
description: >-
  Socialcam was a mobile social video application (iPhone, Android, Windows
  Phone) for capturing, editing, and sharing short videos across social
  networks. Founded by Michael Seibel, Ammon Bartram, and Guillaume Luccisano
  out of Y Combinator (W2012) and backed by a16z, it reached roughly 16 million
  downloads and was acquired by Autodesk in July 2012 for $60 million. The
  consumer service was discontinued on October 28, 2015, and socialcam.com no
  longer resolves to a live web host (AWS Route 53 nameservers only, no A
  record), so there is no developer portal, API, documentation, or agent
  surface to enrich.
